<div id="app" class="pitara-v3">
  <aside class="sidebar">
    <div class="logo-wrap">
      <div class="logo">PITARA</div>
      <div class="version">v3.2</div>
    </div>
    <nav class="nav">
      <div class="ni on" onclick="go('insights',this)">Insights</div>
      <div class="ni" onclick="go('ops',this)">Daily Ops</div>
      <div class="ni" onclick="go('orders',this)">Orders</div>
      <div class="ni" onclick="go('inventory',this)">Inventory</div>
      <div class="ni" onclick="go('master',this)">Master Data</div>
    </nav>
  </aside>
  <main class="content">
    <header class="top-bar">
      <h1 id="tb-title">Insights</h1>
    </header>
    <div id="pane-insights" class="pane on"></div>
    <div id="pane-ops" class="pane"></div>
    <div id="pane-orders" class="pane"></div>
    <div id="pane-inventory" class="pane"></div>
    <div id="pane-master" class="pane"></div>
  </main>
</div>
<script>
function go(name,btn){
  document.querySelectorAll('.pane').forEach(function(p){p.classList.remove('on')});
  document.querySelectorAll('.ni').forEach(function(n){n.classList.remove('on')});
  ge('pane-'+name).classList.add('on');
  if(btn)btn.classList.add('on');
  S.pane=name;
}
</script>
