<style>
:root{
  --bg:#f4f5f7;--bg2:#ffffff;--bg3:#f8f9fa;--panel:#ffffff;--panel2:#fdfdfd;
  --tx:#1a1d23;--tx2:#4a5568;--tx3:#718096;--bdr:#e2e8f0;--bdr2:#cbd5e0;
  --tl:#0d9488;--al:#0f766e;--am:#d97706;--co:#e11d48;--in:#2563eb;--pu:#7c3aed;--gr:#64748b;
  --ind:#6366f1;--teal:#0d9488;--red:#e11d48;
  --r:12px;--r2:16px;--r-sm:8px;--sh:0 4px 6px -1px rgba(0,0,0,0.1),0 2px 4px -1px rgba(0,0,0,0.06);
}
/* Basic reset and styles */
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:13px;line-height:1.5}
*{box-sizing:border-box}
.sidebar{width:240px;height:100vh;position:fixed;left:0;top:0;background:#1e293b;color:white;display:flex;flex-direction:column;z-index:100}
.content{margin-left:240px;padding:20px;min-height:100vh}
.pane{display:none}.pane.on{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;border-radius:var(--r-sm);font-weight:600;cursor:pointer;border:1px solid transparent;transition:all 0.2s}
.btn.bp{background:var(--ind);color:white}.btn.bp:hover{background:#4f46e5}
.btn.bg{background:var(--bg2);color:var(--tx);border-color:var(--bdr)}
.btn.bsm{padding:4px 10px;font-size:11px}
.tag{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase}
.t-tl{background:#ccfbf1;color:#0f766e}
.t-am{background:#fef3c7;color:#92400e}
.t-co{background:#ffe4e6;color:#9f1239}
.t-in{background:#dbeafe;color:#1e40af}
.t-pu{background:#f3e8ff;color:#6b21a8}
.t-gr{background:#f1f5f9;color:#475569}
</style>
